<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque Express · Lentes</title>
<meta name="theme-color" content="#B3121F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FFC72C'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23B3121F'/%3E%3Cellipse cx='25' cy='24' rx='7' ry='4' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--red:#B3121F;--red-d:#7E0A14;--red-l:#FBE3E5;--yel:#FFC72C;--yel-d:#E0A800;--yel-l:#FFF4CC;--ink:#2A1A16;--mut:#7A6A62;--bg:#FFF9EF;--card:#fff;--line:#EADFCF;--ok:#2E7D32;--ok-l:#E3F2E4;--r:14px;--sh:0 2px 10px rgba(120,20,20,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:15px}
[hidden]{display:none!important}
code{background:var(--yel-l);padding:1px 5px;border-radius:5px;font-size:13px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#D3212F 0,#B3121F 40%,#7E0A14 100%)}
.login-card{background:#fff;border-radius:22px;max-width:400px;width:100%;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:8px solid var(--yel)}
.login-card form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:48px;height:48px;flex:none}
.logo-txt b{display:block;font-size:22px;color:var(--red);line-height:1.1}
.logo-txt span{font-size:13px;color:var(--mut);font-style:italic}
.erro-txt{color:var(--red);font-size:14px;margin:0;min-height:1em}
.aviso-demo{background:var(--yel-l);border-left:5px solid var(--yel-d);padding:10px 12px;border-radius:10px;font-size:14px;margin:0}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:none;background:linear-gradient(180deg,var(--red) 0,var(--red-d) 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
#side .logo-txt b{color:#fff}
#side .logo-txt span{color:var(--yel)}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:26px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#FFE9EB;text-decoration:none;cursor:pointer;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.ativo{background:var(--yel);color:var(--red-d);font-weight:bold;box-shadow:0 3px 0 var(--yel-d)}
.nav svg,#bottom svg{width:20px;height:20px;flex:none}
.side-pe{margin-top:auto;font-size:12px;color:#FFD6DA;padding:10px;line-height:1.5}
.side-pe button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:6px;font-size:13px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--yel);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo h1{margin:0;font-size:24px;color:var(--red-d);flex:1;min-width:120px}
.mes{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:3px}
.mes button{border:0;background:var(--yel-l);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--red-d);font-weight:bold}
.mes span{padding:0 8px;font-weight:bold;min-width:140px;text-align:center;font-size:14px}
.badge-demo{background:var(--yel);color:var(--red-d);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:bold}
#view{padding:22px 26px 40px;max-width:1320px;width:100%}
#bottom{display:none}
@media(max-width:860px){
  #side{display:none}
  #bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--red-d);border-top:3px solid var(--yel);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#FFD6DA;font-size:10px;text-decoration:none;padding:5px 0;border-radius:10px;min-width:0}
  #bottom a.ativo{color:var(--red-d);background:var(--yel);font-weight:bold}
  .topo{padding:10px 12px;gap:8px}
  .topo h1{font-size:20px}
  .mes span{min-width:110px;font-size:13px}
  #view{padding:14px 12px 100px}
}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.mt{margin-top:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid var(--line);min-width:0}
.card h2{margin:0 0 4px;font-size:18px;color:var(--red-d);display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px;font-style:italic}
.kpi{border-left:6px solid var(--red)}
.kpi.am{border-left-color:var(--yel)}
.kpi small{color:var(--mut);display:block;font-size:13px}
.kpi b{font-size:25px;display:block;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi em{font-size:12px;color:var(--mut)}
@media(max-width:600px){.kpi b{font-size:20px}}
.boas{background:linear-gradient(120deg,var(--red),var(--red-d));color:#fff;border:0;margin-bottom:16px}
.boas h2{color:var(--yel)}
.boas p{margin:6px 0 14px}

/* ---------- forms ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);min-width:0}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-l)}
input[readonly]{background:#F7F2EA}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.span2{grid-column:span 2}
@media(max-width:420px){.span2{grid-column:auto}}
.qrow{display:flex;gap:6px}
.qrow input{flex:1}
.btn{border:0;background:var(--red);color:#fff;padding:11px 18px;border-radius:11px;cursor:pointer;font-weight:bold;box-shadow:0 3px 0 var(--red-d);transition:transform .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn.am{background:var(--yel);color:var(--red-d);box-shadow:0 3px 0 var(--yel-d)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.perigo{background:#4A0A0F;box-shadow:0 3px 0 #200}
.btn.peq{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
.acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.barra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.barra>*{flex:1 1 160px}
.barra .btn{flex:0 0 auto}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;cursor:pointer;font-weight:bold;color:var(--red-d)}
.chip:hover{background:var(--yel-l)}
.radios{display:flex;flex-direction:column;gap:6px;font-size:14px}
.radios label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.radios input{width:auto;margin-top:3px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:auto}

/* ---------- tabelas ---------- */
.tabela-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th{background:var(--yel-l);color:var(--red-d);text-align:left;padding:10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;white-space:nowrap;z-index:1}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FFFBEE}
tr.estornado td{opacity:.45}
tr.estornado td:not(:last-child){text-decoration:line-through}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:bold;background:#FFF8E1}
td select{padding:6px 8px;font-size:13px}
.hide-m{}
@media(max-width:700px){.hide-m{display:none}td,th{padding:8px 6px}table{font-size:13px}}

/* ---------- etiquetas ---------- */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold;letter-spacing:.03em;white-space:nowrap}
.p-ATIVO{background:var(--ok-l);color:var(--ok)}
.p-INATIVO{background:var(--yel-l);color:#8A5A00}
.p-DESATIVO{background:#ECECEC;color:#777}
.p-MISTO{background:#EFE7FF;color:#5B3BA0}
.p-LENTE{background:var(--red-l);color:var(--red-d)}
.p-BLOCO{background:#FFE9C7;color:#8A4B00}
.p-NOVO{background:var(--red);color:#fff}
.qtd{display:inline-block;min-width:38px;text-align:center;padding:3px 8px;border-radius:8px;font-weight:bold;background:var(--ok-l);color:var(--ok);font-variant-numeric:tabular-nums}
.qtd.baixo{background:var(--yel);color:var(--red-d)}
.qtd.zero{background:var(--red);color:#fff}
.qtd.neg{background:#222;color:var(--yel)}

/* ---------- entrada em massa ---------- */
.grade-cel{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:430px;overflow:auto;padding:2px}
.cel{border:1.5px solid var(--line);border-radius:12px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:4px}
.cel.tem{border-color:var(--red);background:var(--red-l)}
.cel b{font-size:14px}
.cel small{color:var(--mut);font-size:11px}
.cel input{padding:6px 8px;text-align:center;font-weight:bold}

/* ---------- painel ---------- */
.linha-b{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.trilho{height:14px;background:var(--yel-l);border-radius:8px;overflow:hidden}
.trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#E2343F);border-radius:8px}
.mov{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.mov:first-child{border-top:0}
.mov .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:bold}
.mov small{color:var(--mut)}
.ic.ENTRADA{background:var(--ok-l);color:var(--ok)}
.ic.SAIDA{background:var(--red-l);color:var(--red)}
.ic.PERDA{background:#222;color:var(--yel)}
.ic.AJUSTE{background:var(--yel-l);color:#8A5A00}
.repor{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.repor:first-child{border-top:0}
.vazio{text-align:center;color:var(--mut);padding:24px;font-style:italic}
.alerta{background:var(--red-l);border-left:5px solid var(--red);padding:12px 14px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alerta.am{background:var(--yel-l);border-left-color:var(--yel-d)}
.preco{display:flex;gap:18px;flex-wrap:wrap;background:var(--yel-l);border:1.5px dashed var(--yel-d);border-radius:12px;padding:12px 14px;margin-top:14px}
.preco small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.preco b{font-size:18px;color:var(--red-d);font-variant-numeric:tabular-nums}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;background:rgba(40,8,10,.55);z-index:100;display:grid;place-items:center;padding:16px}
.modal-box{background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:22px;border-top:6px solid var(--yel)}
.modal-box h3{margin:0 0 12px;color:var(--red-d);font-size:20px}
#toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;border-left:6px solid var(--yel);box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:360px;animation:ent .25s}
.toast.erro{border-left-color:#FF5A66;background:#5A0A10}
@keyframes ent{from{transform:translateY(-10px);opacity:0}}
@media(max-width:860px){#toasts{left:12px;right:12px;top:auto;bottom:92px}.toast{max-width:none}}

/* ---------- impressão ---------- */
#print-area{display:none;color:#000;font-family:Georgia,serif}
@media print{
  body{background:#fff}
  #login,#app,#bottom,#modal,#toasts{display:none!important}
  #print-area{display:block}
}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pa-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid #B3121F;padding-bottom:8px;margin-bottom:10px}
.pa-head small{color:#B3121F;font-weight:bold;letter-spacing:.12em;font-size:10px}
.pa-head h1{margin:2px 0;font-size:20px}
.pa-head p{margin:0;font-size:11px;color:#333}
.pa-faixa{width:80px;height:14px;background:linear-gradient(90deg,#B3121F 50%,#FFC72C 50%)}
.pa-campos{display:flex;gap:22px;font-size:12px;margin:6px 0 10px}
.pa-campos span{flex:1;border-bottom:1px solid #000;padding-bottom:3px}
.pa table{width:100%;border-collapse:collapse;font-size:11px;background:#fff}
.pa th{background:#FFE89A;color:#000;border:1px solid #000;padding:5px;font-size:9.5px;position:static}
.pa td{border:1px solid #555;padding:3px 6px;height:24px}
.pa h2{font-size:14px;margin:12px 0 6px;color:#B3121F}
.pa .bloco{break-inside:avoid;page-break-inside:avoid}
.pa .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pa-nota{font-size:10px;color:#222;margin:6px 0}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#FFC72C"/><circle cx="32" cy="32" r="21" fill="#B3121F"/><circle cx="32" cy="32" r="13" fill="none" stroke="#FFC72C" stroke-width="2" opacity=".5"/><ellipse cx="25" cy="24" rx="7" ry="4" fill="#fff" opacity=".6"/></svg>
      <div class="logo-txt"><b>Estoque Express</b><span>Lentes &amp; Blocos</span></div>
    </div>
    <form id="f-login">
      <p id="login-aviso" class="aviso-demo" hidden></p>
      <label class="f" id="l-email-w">E-mail<input type="email" id="l-email" autocomplete="username"></label>
      <label class="f" id="l-senha-w">Senha<input type="password" id="l-senha" autocomplete="current-password"></label>
      <button class="btn" id="l-btn" type="submit">Entrar</button>
      <p id="login-erro" class="erro-txt"></p>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <aside id="side">
    <div class="logo">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#FFC72C"/><circle cx="32" cy="32" r="21" fill="#7E0A14"/><ellipse cx="25" cy="24" rx="7" ry="4" fill="#fff" opacity=".6"/></svg>
      <div class="logo-txt"><b>Estoque Express</b><span>Lentes &amp; Blocos</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-pe"><span id="side-user"></span><br><button id="side-sair">Sair</button></div>
  </aside>
  <main>
    <header class="topo">
      <h1 id="titulo">Painel</h1>
      <span class="badge-demo" id="badge-demo" hidden>DEMONSTRAÇÃO</span>
      <div class="mes"><button id="mes-ant" title="Mês anterior">‹</button><span id="mes-txt"></span><button id="mes-prox" title="Próximo mês">›</button></div>
    </header>
    <div id="view"></div>
  </main>
  <nav id="bottom"></nav>
</div>

<datalist id="dl-linhas"></datalist>
<div id="modal" hidden></div>
<div id="toasts"></div>
<div id="print-area" class="pa"></div>

<script type="module">
/* =====================================================================
   1) CONFIGURAÇÃO — cole aqui os dados do seu projeto Firebase
   (Console do Firebase > Configurações do projeto > Seus apps > Web)
   Enquanto apiKey estiver vazio, o sistema roda em MODO DEMONSTRAÇÃO
   (dados ficam só no navegador).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAqAurw7SwzFX7ttYPaCpd9jZLN7EVbj0o",
  authDomain: "estoque-lentes-express.firebaseapp.com",
  projectId: "estoque-lentes-express",
  storageBucket: "estoque-lentes-express.firebasestorage.app",
  messagingSenderId: "810370428938",
  appId: "1:810370428938:web:2a724560a51564bd8aaff3"
};

const OTICAS_PADRAO = ["Ótica Express", "Ótica Vila Isa", "Rede Express", "Vision Center"];

// Regras automáticas de status (pela linha do produto). Editáveis em Ajustes.
// Cada regra casa quando TODAS as palavras dela aparecem no nome da linha.
const REGRAS_PADRAO = {
  ativos: [
    "FILTRO AZUL", "ANTIREFLEXO", "RESINA INCOLOR",
    "EXCELSIOR TRADICIONAL INCOLOR", "EXCELSIOR TRADICIONAL FOTO",
    "ESPACE PLUS INCOLOR", "ESPACE PLUS TRANSITIONS",
    "NOLINE INCOLOR",
    "PANOPITIK INCOLOR", "AMPLUS INCOLOR", "PANOPITIK FOTO", "AMPLUS FOTO",
    "BLOCO VISAO SIMPLES"
  ],
  inativos: ["CRIZAL", "POLICARBONATO INCOLOR", "POLICARBONATO ANTIREFLEXO", "NOLINE FOTO"]
};

const MOTIVOS_PERDA = ["Quebra no manuseio", "Defeito de fábrica", "Erro de surfaçagem", "Erro de montagem", "Risco / arranhão", "Grau errado", "Vencido / amarelado", "Outro"];
const STATUS = ["ATIVO", "INATIVO", "DESATIVO"];
const STATUS_TXT = { ATIVO: "Ativo — compra pra repor", INATIVO: "Inativo — vende, não repõe", DESATIVO: "Desativo — não acha pra comprar" };
const MODO_LOCAL = !FIREBASE_CONFIG.apiKey;
const FM = '"R$" #,##0.00';

/* ===================== utilidades ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function brl(n) { return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function num(n) { return (Number(n) || 0).toLocaleString('pt-BR'); }
function fmtDec(n) { return (Number(n) || 0).toFixed(2).replace('.', ','); }
function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}
function hoje() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hojeYM() { return hoje().slice(0, 7); }
function fmtData(s) { return s ? String(s).split('-').reverse().join('/') : ''; }
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function nomeMes(ym) { const [y, m] = ym.split('-'); return MESES[+m - 1] + ' de ' + y; }
function proxMes(ym) { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0'); }
function antMes(ym) { let [y, m] = ym.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return y + '-' + String(m).padStart(2, '0'); }
function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
    .replace(/PHOTO/g, 'FOTO').replace(/ANTI[\s\-]*R+EFLEXO/g, 'ANTIREFLEXO')
    .replace(/[^A-Z0-9+\-.,]/g, ' ').replace(/\s+/g, ' ').trim();
}
function slug(s) { return norm(s).replace(/,/g, '.').replace(/\+/g, 'P').replace(/-/g, 'M').replace(/[^A-Z0-9.]+/g, '_').replace(/^_+|_+$/g, '') || 'X'; }
function idItem(linha, grade) { return slug(linha) + '__' + slug(grade || 'UNICO'); }
function fatiar(a, n) { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; }
function opts(lista, sel, labels) { return lista.map(v => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(labels ? labels[v] : v)}</option>`).join(''); }
function pill(v) { return `<span class="pill p-${esc(v)}">${esc(v)}</span>`; }
function chaveGrade(g) { return (String(g).replace(/,/g, '.').match(/[+-]?\d+(\.\d+)?/g) || []).map(Number); }
function cmpGrade(a, b) {
  const x = chaveGrade(a), y = chaveGrade(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? -999) - (y[i] ?? -999); if (d) return d; }
  return String(a).localeCompare(String(b), 'pt');
}
function cmpItem(a, b) { return String(a.linha).localeCompare(String(b.linha), 'pt') || cmpGrade(a.grade, b.grade); }
function statusPorRegra(linha) {
  const t = new Set(norm(linha).split(' '));
  const casa = r => { const ws = norm(r).split(' ').filter(Boolean); return ws.length && ws.every(w => t.has(w)); };
  if ((S.config.regras?.inativos || []).some(casa)) return 'INATIVO';
  if ((S.config.regras?.ativos || []).some(casa)) return 'ATIVO';
  return 'DESATIVO';
}
function tipoPorNome(linha, grade) {
  return /BLOCO|EXCELSIOR|ESPACE|NOLINE|PANOP|AMPLUS|MULTIFOCAL|BIFOCAL/.test(norm(linha)) || /BASE/.test(norm(grade)) ? 'BLOCO' : 'LENTE';
}

  const m = s.match(/\s(BASE\b.*|[+\-]\s?\d+[.,]\d{1,2}.*|0[.,]00\b.*|\d+[.,]\d{2}\s*[x\/].*)$/i);

}

let fb = null, unsubs = [], unsubMes = null;
const LKEY = 'estoqueLentes_v1';
let LOCAL = { itens: {}, movs: [], config: null }, memOnly = false;

function lerLocal() { try { const t = localStorage.getItem(LKEY); if (t) LOCAL = JSON.parse(t); } catch (e) { memOnly = true; } }
function gravarLocal() {

async function iniciarFirebase() {
  const V = '10.12.2';
  const [appM, fsM, authM] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)

  catch (e) { db = fsM.getFirestore(app); }
  const auth = authM.getAuth(app);
  fb = { db, auth, fs: fsM, au: authM };
  authM.onAuthStateChanged(auth, u => u ? entrou(u) : saiu());
}
function erroFb(e) { console.error(e); toast('Erro no banco: ' + (e.code === 'permission-denied' ? 'sem permissão — confira as regras do Firestore' : e.message), 'erro', 7000); }

function ouvirTudo() {
  const { db, fs } = fb;
  unsubs.push(fs.onSnapshot(fs.collection(db, 'itens'), snap => {
    snap.docChanges().forEach(ch => { if (ch.type === 'removed') S.itens.delete(ch.doc.id); else S.itens.set(ch.doc.id, { id: ch.doc.id, ...ch.doc.data() }); });
    dadosMudaram();
  }, erroFb));
  unsubs.push(fs.onSnapshot(fs.doc(db, 'config', 'geral'), d => { if (d.exists()) S.config = { ...S.config, ...d.data() }; dadosMudaram(); }, erroFb));
  ouvirMes(S.mes);
}
function ouvirMes(ym) {
  S.mes = ym;
  if (MODO_LOCAL) { S.movs = (LOCAL.movs || []).filter(m => String(m.data).startsWith(ym)); dadosMudaram(); return; }
  if (!fb) return;
  unsubMes && unsubMes();
  const { db, fs } = fb;
  const q = fs.query(fs.collection(db, 'movimentos'), fs.where('data', '>=', ym + '-01'), fs.where('data', '<', proxMes(ym) + '-01'));
  unsubMes = fs.onSnapshot(q, snap => { S.movs = snap.docs.map(d => ({ id: d.id, ...d.data() })); dadosMudaram(); }, erroFb);
}

async function salvarItens(lista, onProg) {
  const agora = Date.now();
  if (MODO_LOCAL) {
    lista.forEach(it => { const { id, ...d } = it; LOCAL.itens[id] = { ...(LOCAL.itens[id] || {}), ...d, atualizadoEm: agora }; S.itens.set(id, { ...LOCAL.itens[id], id }); });
    gravarLocal(); dadosMudaram(); onProg && onProg(lista.length, lista.length); return;
  }
  const { db, fs } = fb; let feito = 0;
  for (const parte of fatiar(lista, 400)) {
    const b = fs.writeBatch(db);
    parte.forEach(it => { const { id, ...d } = it; b.set(fs.doc(db, 'itens', id), { ...d, atualizadoEm: agora }, { merge: true }); });
    await b.commit(); feito += parte.length; onProg && onProg(feito, lista.length);
  }
}
async function excluirItens(ids) {
  if (MODO_LOCAL) { ids.forEach(id => { delete LOCAL.itens[id]; S.itens.delete(id); }); gravarLocal(); dadosMudaram(); return; }
  const { db, fs } = fb;
  for (const parte of fatiar(ids, 400)) { const b = fs.writeBatch(db); parte.forEach(id => b.delete(fs.doc(db, 'itens', id))); await b.commit(); }
}
// Registra movimentos e altera o estoque na mesma operação (delta: + entra, − sai)
async function registrar(movs) {
  const agora = Date.now();
  if (MODO_LOCAL) {
    movs.forEach((m, i) => {
      const it = LOCAL.itens[m.itemId]; if (it) { it.qtd = (Number(it.qtd) || 0) + m.delta; S.itens.set(m.itemId, { ...it, id: m.itemId }); }
      LOCAL.movs.push({ ...m, id: 'm' + agora + '_' + i + '_' + Math.random().toString(36).slice(2, 6), criadoEm: agora + i });
    });
    gravarLocal(); ouvirMes(S.mes); return;
  }
  const { db, fs } = fb;
  for (const parte of fatiar(movs, 200)) {
    const b = fs.writeBatch(db);
    parte.forEach((m, i) => {
      b.update(fs.doc(db, 'itens', m.itemId), { qtd: fs.increment(m.delta), atualizadoEm: agora });
      b.set(fs.doc(fs.collection(db, 'movimentos')), { ...m, criadoEm: agora + i });
    });
    await b.commit();
  }
}
async function estornar(lista) {
  lista = lista.filter(m => !m.estornado); if (!lista.length) return;
  const agora = Date.now();
  if (MODO_LOCAL) {
    lista.forEach(m => {
      const mm = LOCAL.movs.find(x => x.id === m.id); if (mm) { mm.estornado = true; mm.estornadoEm = agora; }
      const it = LOCAL.itens[m.itemId]; if (it) { it.qtd = (Number(it.qtd) || 0) - m.delta; S.itens.set(m.itemId, { ...it, id: m.itemId }); }
    });
    gravarLocal(); ouvirMes(S.mes); return;
  }
  const { db, fs } = fb;
  for (const parte of fatiar(lista, 200)) {
    const b = fs.writeBatch(db);
    parte.forEach(m => {
      b.update(fs.doc(db, 'movimentos', m.id), { estornado: true, estornadoEm: agora });
      if (S.itens.has(m.itemId)) b.update(fs.doc(db, 'itens', m.itemId), { qtd: fs.increment(-m.delta), atualizadoEm: agora });
    });
    await b.commit();
  }
}
async function salvarConfig(parcial) {
  S.config = { ...S.config, ...parcial };
  if (MODO_LOCAL) { LOCAL.config = S.config; gravarLocal(); dadosMudaram(); return; }
  await fb.fs.setDoc(fb.fs.doc(fb.db, 'config', 'geral'), parcial, { merge: true });
}
async function todosMovimentos() {
  if (MODO_LOCAL) return [...(LOCAL.movs || [])];
  const s = await fb.fs.getDocs(fb.fs.collection(fb.db, 'movimentos'));

}
async function restaurarBackup(dados) {
  if (!dados || dados.app !== 'estoque-lentes' || !Array.isArray(dados.itens)) throw new Error('arquivo não é um backup deste sistema');
  const movs = dados.movimentos || [];
  if (MODO_LOCAL) {
    dados.itens.forEach(it => { const { id, ...d } = it; LOCAL.itens[id] = d; });
    const ids = new Set(LOCAL.movs.map(m => m.id)); movs.forEach(m => { if (!ids.has(m.id)) LOCAL.movs.push(m); });
    if (dados.config) LOCAL.config = dados.config;
    gravarLocal(); carregarLocal(); return;
  }
  const { db, fs } = fb;
  for (const parte of fatiar(dados.itens, 400)) { const b = fs.writeBatch(db); parte.forEach(it => { const { id, ...d } = it; b.set(fs.doc(db, 'itens', id), d); }); await b.commit(); }
  for (const parte of fatiar(movs, 400)) { const b = fs.writeBatch(db); parte.forEach(m => { const { id, ...d } = m; b.set(fs.doc(db, 'movimentos', id), d); }); await b.commit(); }
  if (dados.config) await fs.setDoc(fs.doc(db, 'config', 'geral'), dados.config);
}

/* ===================== consultas ===================== */
function itensOrdenados() { return [...S.itens.values()].sort(cmpItem); }
function linhas() {
  const m = new Map();
  for (const it of S.itens.values()) {
    let l = m.get(it.linha);
    if (!l) { l = { linha: it.linha, tipo: it.tipo, sts: new Set(), itens: [], qtd: 0 }; m.set(it.linha, l); }
    l.itens.push(it); l.sts.add(it.status); l.qtd += Math.max(0, Number(it.qtd) || 0);
  }
  return [...m.values()].map(l => ({ ...l, status: l.sts.size > 1 ? 'MISTO' : [...l.sts][0] })).sort((a, b) => a.linha.localeCompare(b.linha, 'pt'));
}
function resolverLinha(nome) { const n = norm(nome); for (const it of S.itens.values()) if (norm(it.linha) === n) return it.linha; return String(nome || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
function gradesDaLinha(nome) { const n = norm(nome); return [...S.itens.values()].filter(i => norm(i.linha) === n).sort((a, b) => cmpGrade(a.grade, b.grade)); }
function novoItemBase(linha, grade) {
  const irmao = gradesDaLinha(linha)[0];
  const status = irmao ? irmao.status : statusPorRegra(linha);
  return { id: idItem(linha, grade), linha, grade, codigo: '', qtd: 0,
    tipo: irmao ? irmao.tipo : tipoPorNome(linha, grade), status,
    custo: irmao ? (+irmao.custo || 0) : 0, venda: irmao ? (+irmao.venda || 0) : 0,
    min: irmao ? (+irmao.min || 0) : (status === 'ATIVO' ? S.config.minPadrao : 0) };
}
function faltando(i) { return i.status === 'ATIVO' && (Number(i.qtd) || 0) < (Number(i.min) || 0); }
function listaReposicao() { return itensOrdenados().filter(faltando).map(i => ({ ...i, comprar: (+i.min || 0) - (+i.qtd || 0) })); }
function qtdBadge(i) {
  const q = Number(i.qtd) || 0;
  const c = q < 0 ? 'neg' : q === 0 ? 'zero' : faltando(i) ? 'baixo' : '';
  return `<span class="qtd ${c}">${num(q)}</span>`;
}
function movsOrdenados(tipo) {
  return S.movs.filter(m => !tipo || m.tipo === tipo).sort((a, b) => String(b.data).localeCompare(String(a.data)) || (b.criadoEm || 0) - (a.criadoEm || 0));
}
function resumoMes(movs) {
  const r = { ent: { qtd: 0, custo: 0 }, sai: { qtd: 0, venda: 0, custo: 0 }, per: { qtd: 0, custo: 0 }, otica: {}, motivo: {}, linha: {} };
  const soma = (obj, k, q, m) => { const o = obj[k] || (obj[k] = { qtd: 0, venda: 0, custo: 0 }); o.qtd += q; o.venda += q * (+m.venda || 0); o.custo += q * (+m.custo || 0); };
  for (const m of movs) {
    if (m.estornado) continue; const q = +m.qtd || 0;
    if (m.tipo === 'ENTRADA') { r.ent.qtd += q; r.ent.custo += q * (+m.custo || 0); }
    else if (m.tipo === 'SAIDA') { r.sai.qtd += q; r.sai.venda += q * (+m.venda || 0); r.sai.custo += q * (+m.custo || 0); soma(r.otica, m.otica || '—', q, m); soma(r.linha, m.linha, q, m); }
    else if (m.tipo === 'PERDA') { r.per.qtd += q; r.per.custo += q * (+m.custo || 0); soma(r.motivo, m.motivo || 'Outro', q, m); }
  }
  return r;
}
function descMov(m) {
  if (m.tipo === 'SAIDA') return `OS ${esc(m.os || '—')} · ${esc(m.otica || '')}`;
  if (m.tipo === 'ENTRADA') return `Entrada${m.fornecedor ? ' · ' + esc(m.fornecedor) : ''}${m.nf ? ' · NF ' + esc(m.nf) : ''}`;
  if (m.tipo === 'PERDA') return `Perda · ${esc(m.motivo || '')}`;
  return esc(m.obs || 'Ajuste');
}

/* ===================== campos ligados: linha → grau ===================== */
function preencherGraus(sel, linha, manter) {
  const its = gradesDaLinha(linha), atual = manter ? sel.value : '';
  sel.innerHTML = !linha ? '<option value="">Escolha a linha primeiro</option>'
    : its.length ? '<option value="">Escolha…</option>' + its.map(i => `<option value="${esc(i.id)}">${esc(i.grade)}  ·  estoque ${num(i.qtd || 0)}</option>`).join('')
    : '<option value="">Nenhum grau nessa linha</option>';
  if (atual && its.some(i => i.id === atual)) sel.value = atual;
}

   ===================================================================== */
const VIEWS = {};

/* ---------- PAINEL ---------- */
VIEWS.painel = {
  montar() {},
  atualizar(el) {
    const its = [...S.itens.values()];
    let unid = 0, unL = 0, unB = 0, vc = 0, vv = 0; const cont = { ATIVO: 0, INATIVO: 0, DESATIVO: 0 };

      <label class="f">Preço de venda (R$)<input id="fi-venda" inputmode="decimal" value="${fmtDec(v.venda)}"></label>

    ${it ? '<p class="sub" style="margin-top:12px">Mudar a quantidade aqui gera um registro de <b>ajuste</b> no histórico.</p>' : ''}
    <div class="acoes">${it ? '<button class="btn perigo" id="fi-del" style="margin-right:auto">Excluir</button>' : ''}<button class="btn sec" id="fi-x">Cancelar</button><button class="btn" id="fi-ok">Salvar</button></div>`, m => {
    $('#fi-x', m).onclick = fecharModal;

    });
    $('#fi-ok', m).onclick = e => acao(e.target, async () => {
      const linha = it ? it.linha : resolverLinha($('#fi-linha').value), grade = it ? it.grade : $('#fi-grade').value.trim().replace(/\s+/g, ' ').toUpperCase();
      if (!linha || !grade) throw new Error('preencha a linha e o grau/base');
      const nid = it ? it.id : idItem(linha, grade);
      if (!it && S.itens.has(nid)) throw new Error('esse item já existe no estoque');
      const d = { id: nid, linha, grade, codigo: $('#fi-cod').value.trim(), tipo: $('#fi-tipo').value, status: $('#fi-status').value, min: parseInt($('#fi-min').value) || 0, custo: parseNum($('#fi-custo').value), venda: parseNum($('#fi-venda').value) };
      const nq = parseInt($('#fi-qtd').value) || 0;
      if (!it) await salvarItens([{ ...d, qtd: nq }]);
      else {

    });
  }
};
function addLote(linha, grade, qtd) { const id = idItem(linha, grade); const ex = S.itens.get(id); const cur = S.lote.get(id); S.lote.set(id, { id, linha: ex ? ex.linha : linha, grade: ex ? ex.grade : grade, qtd: (cur?.qtd || 0) + qtd }); }
function parseColar(txt, linhaPadrao) {
  const ok = [], erros = [];
  String(txt || '').split(/\r?\n/).forEach((l, i) => {
    l = l.trim(); if (!l) return;
    const p = l.split(/[;\t]/).map(s => s.trim()).filter(Boolean); let linha, grade, q;
    if (p.length >= 3) [linha, grade, q] = p; else if (p.length === 2) { [grade, q] = p; linha = linhaPadrao; }
    else { const t = l.split(/\s+/); q = t.pop(); grade = t.join(' '); linha = linhaPadrao; }
    q = parseInt(q);
    if (!linha || !grade || !(q > 0)) { erros.push(i + 1); return; }
    ok.push({ linha: resolverLinha(linha), grade: grade.replace(/\s+/g, ' ').toUpperCase(), qtd: q });
  });
  return { ok, erros };
}

function lerImport(file) {

  const rd = new FileReader();
  rd.onload = e => {
    try { const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' }); IMP = { wb, aba: wb.SheetNames[0], nome: file.name, modo: 'tudo' }; carregarAba(); }
    catch (err) { toast('Não consegui ler o arquivo: ' + err.message, 'erro'); }

function carregarAba() {
  IMP.aoa = XLSX.utils.sheet_to_json(IMP.wb.Sheets[IMP.aba], { header: 1, defval: '', raw: true, blankrows: false });

}
function adivinharMapa() {
  const hs = (IMP.aoa[IMP.hdr] || []).map(h => norm(h)), usados = new Set(); IMP.map = {};
  for (const c of CAMPOS_IMPORT) {
    if (!c.dicas) continue;
    const i = hs.findIndex((h, ix) => !usados.has(ix) && h && c.dicas.some(d => h.includes(d)));
    if (i >= 0) { IMP.map[c.k] = i; usados.add(i); }
  }
}
function processarImport() {
  const m = IMP.map, out = new Map(); let dup = 0, ign = 0;
  const vazio = v => v == null || String(v).trim() === '';
  for (const r of IMP.aoa.slice(IMP.hdr + 1)) {
    const g = k => m[k] != null ? r[m[k]] : undefined;
    let linha = g('linha'), grade = g('grade');
    if ((vazio(linha) || vazio(grade)) && !vazio(g('descricao'))) { const p = separarDescricao(g('descricao')); if (vazio(linha)) linha = p.linha; if (vazio(grade)) grade = p.grade; }
    linha = String(linha ?? '').trim().replace(/\s+/g, ' ').toUpperCase();
    grade = String(grade ?? '').trim().replace(/\s+/g, ' ').toUpperCase() || 'ÚNICO';
    if (!linha) { ign++; continue; }
    const tR = norm(g('tipo')), sR = norm(g('status'));
    const it = { id: idItem(linha, grade), linha, grade, codigo: String(g('codigo') ?? '').trim(),
      tipo: tR.includes('BLOCO') ? 'BLOCO' : tR.includes('LENTE') ? 'LENTE' : tipoPorNome(linha, grade),
      status: sR.startsWith('DESAT') ? 'DESATIVO' : sR.startsWith('INAT') ? 'INATIVO' : sR.startsWith('ATIV') ? 'ATIVO' : statusPorRegra(linha),
      qtd: Math.round(parseNum(g('qtd'))), custo: parseNum(g('custo')), venda: parseNum(g('venda')),
      min: m.min != null ? Math.round(parseNum(g('min'))) : null };
    if (out.has(it.id)) { dup++; out.get(it.id).qtd += it.qtd; } else out.set(it.id, it);

}

function folha(cols, rows) {

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cols.map(c => ({ wch: c.w || 14 }));
  const rg = XLSX.utils.decode_range(ws['!ref']);
  cols.forEach((c, ci) => { if (!c.f) return; for (let r = 1; r <= rg.e.r; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c: ci })]; if (cell && cell.t === 'n') cell.z = c.f; } });
  ws['!autofilter'] = { ref: ws['!ref'] };
  return ws;
}

  const perdas = comPerdas ? `<div class="bloco"><h2>Perdas e avarias</h2><table><thead><tr><th style="width:62px">Data</th><th>Produto</th><th style="width:120px">Grau / base</th><th style="width:38px">Qtd</th><th style="width:170px">Motivo</th><th style="width:110px">Responsável</th><th style="width:44px">Lançado</th></tr></thead><tbody>${'<tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(5)}</tbody></table></div>` : '';
  imprimir(`${cab('Folha de Saídas Manual', 'Use quando o estoquista não estiver. Anote cada lente/bloco retirado; depois lance no sistema e marque “Lançado”.')}
    <div class="pa-campos"><span>Período: ____/____ a ____/____</span><span>Responsável: </span><span>Folha nº: </span></div>
    <p class="pa-nota"><b>Óticas:</b> ${(S.config.oticas || []).map(esc).join(' · ')} &nbsp;|&nbsp; <b>Par</b> = 2 lentes</p>
    <table><thead><tr><th>Nº</th><th>Data</th><th>OS</th><th>Ótica</th><th>Produto (lente / bloco)</th><th>Grau / base</th><th>Qtd</th><th>Retirado por</th><th>Lançado</th></tr></thead><tbody>${linhasT}</tbody></table>${perdas}`, true);
}
function imprimirContagem(sel, cega) {
  const ls = linhas().filter(l => sel === '__todas' ? true : sel === '__ativas' ? l.itens.some(i => i.status === 'ATIVO') : l.linha === sel);
  if (!ls.length) return toast('Nenhuma linha para imprimir', 'erro');
  const tab = its => `<table><thead><tr><th>Grau / base</th>${cega ? '' : '<th style="width:60px">Sistema</th>'}<th style="width:60px">Contado</th><th style="width:60px">Diferença</th></tr></thead><tbody>${its.map(i => `<tr><td>${esc(i.grade)}</td>${cega ? '' : `<td style="text-align:center">${num(i.qtd || 0)}</td>`}<td></td><td></td></tr>`).join('')}</tbody></table>`;
  const html = ls.map(l => { const its = [...l.itens].sort((a, b) => cmpGrade(a.grade, b.grade)), meio = Math.ceil(its.length / 2);
    return `<div class="bloco"><h2>${esc(l.linha)} <small style="color:#555;font-weight:normal">(${its.length} graus)</small></h2>${its.length > 8 ? `<div class="duas">${tab(its.slice(0, meio))}${tab(its.slice(meio))}</div>` : tab(its)}</div>`; }).join('');
  imprimir(cab('Folha de Contagem de Estoque', `${cega ? 'Contagem cega' : 'Com quantidade do sistema'} · impresso em ${fmtData(hoje())}`) + `<div class="pa-campos"><span>Data da contagem: </span><span>Contado por: </span><span>Conferido por: </span></div>` + html);
}
function imprimirListaCompra() {
  const rep = listaReposicao(); if (!rep.length) return toast('Nada para repor agora 🎉');
  const tot = rep.reduce((s, i) => s + i.comprar, 0), val = rep.reduce((s, i) => s + i.comprar * (+i.custo || 0), 0);
  imprimir(cab('Lista de Compra / Reposição', `Itens ativos abaixo do mínimo · ${fmtData(hoje())} · ${num(tot)} unidades · estimativa ${brl(val)}`) +
    `<table><thead><tr><th>Linha / produto</th><th style="width:130px">Grau / base</th><th style="width:55px">Atual</th><th style="width:55px">Mínimo</th><th style="width:60px">Comprar</th><th style="width:60px">Pedido ✓</th></tr></thead><tbody>${rep.map(i => `<tr><td>${esc(i.linha)}</td><td>${esc(i.grade)}</td><td style="text-align:center">${i.qtd || 0}</td><td style="text-align:center">${i.min}</td><td style="text-align:center"><b>${i.comprar}</b></td><td></td></tr>`).join('')}</tbody></table>`);
}

/* ===================== DADOS DE EXEMPLO (só demonstração) ===================== */
async function carregarExemplo() {
  const lista = [], esf = [];
  for (let v = -3; v <= 3.001; v += 0.25) esf.push(Math.abs(v) < 0.01 ? '0.00' : (v > 0 ? '+' : '-') + Math.abs(v).toFixed(2));
  const blocos = []; [2, 4, 6].forEach(b => ['+1.00', '+1.50', '+2.00', '+2.50', '+3.00'].forEach(a => blocos.push(`BASE ${b} ADD ${a}`)));
  const add = (linha, tipo, custo, venda, grades) => grades.forEach(g => { const status = statusPorRegra(linha);
    lista.push({ id: idItem(linha, g), linha, grade: g, tipo, status, custo, venda, min: status === 'ATIVO' ? 2 : 0, qtd: Math.floor(Math.random() * 7), codigo: '' }); });
  add('LENTE RESINA FILTRO AZUL 1.56', 'LENTE', 18, 120, esf);
  add('LENTE RESINA ANTIREFLEXO 1.56', 'LENTE', 14, 90, esf);
  add('LENTE RESINA INCOLOR 1.49', 'LENTE', 6, 45, esf);
  add('LENTE POLICARBONATO INCOLOR', 'LENTE', 20, 140, esf.slice(4, 21));
  add('LENTE CRIZAL EASY', 'LENTE', 60, 320, esf.slice(6, 19));
  add('LENTE 1.67 HIGH INDEX', 'LENTE', 45, 260, esf.slice(0, 9));
  add('BLOCO VISAO SIMPLES', 'BLOCO', 9, 60, ['BASE 4', 'BASE 6', 'BASE 8']);
  add('BLOCO VISAO SIMPLES FOTO', 'BLOCO', 22, 150, ['BASE 4', 'BASE 6', 'BASE 8']);
  add('BLOCO EXCELSIOR TRADICIONAL INCOLOR', 'BLOCO', 35, 220, blocos);
  add('BLOCO ESPACE PLUS INCOLOR', 'BLOCO', 48, 290, blocos);
  add('BLOCO NOLINE INCOLOR', 'BLOCO', 30, 200, blocos);
  add('BLOCO NOLINE FOTO', 'BLOCO', 55, 340, blocos.slice(0, 10));
  add('BLOCO PANOPITIK AMPLUS INCOLOR', 'BLOCO', 40, 250, blocos);
  await salvarItens(lista);
  const vendaveis = lista.filter(i => i.qtd > 2), movs = [];
  const dia = d => S.mes + '-' + String(d).padStart(2, '0');
  for (let k = 0; k < 24; k++) { const it = vendaveis[Math.floor(Math.random() * vendaveis.length)]; movs.push({ tipo: 'SAIDA', itemId: it.id, linha: it.linha, grade: it.grade, tipoProd: it.tipo, qtd: 1, delta: -1, custo: it.custo, venda: it.venda, os: String(4200 + k), otica: S.config.oticas[k % S.config.oticas.length], data: dia(1 + (k % 7)), estornado: false }); }
  const it = vendaveis[0]; movs.push({ tipo: 'PERDA', itemId: it.id, linha: it.linha, grade: it.grade, tipoProd: it.tipo, qtd: 1, delta: -1, custo: it.custo, venda: it.venda, motivo: 'Erro de surfaçagem', os: '', obs: 'Exemplo', data: dia(3), estornado: false });
  await registrar(movs);
}
